name: Native Ubuntu and macOS kits
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'Cargo.*', 'build.rs', 'scripts/package_native.py', 'scripts/native_*.py', '.github/workflows/native-kits.yml', 'locales/**']
permissions:
  contents: read
jobs:
  package:
    concurrency:
      group: native-kits-${{ matrix.platform }}-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/debug
          key: native-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            native-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}-
            native-${{ matrix.platform }}-
      - name: Ubuntu build dependencies (runner only)
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          printf 'Types: deb deb-src\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: noble-pgdg\nArchitectures: amd64\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-x11-0 libgtk-3-dev libdbus-1-dev libmariadb3 libpq5 libssl3t64 libedit2 libaio1t64 liblz4-1 libzstd1 libpcre2-8-0 libtinfo6 libreadline8t64 libncurses6 libxml2 libkrb5-3 libfido2-1 libevent-core-2.1-7t64 patchelf gnome-keyring dbus-x11 xvfb x11-utils imagemagick
      - name: macOS client kegs (runner only, no services started)
        if: runner.os == 'macOS'
        run: |
          brew install mysql-client@8.4 mariadb@11.4 libpq
          security create-keychain -p fixture "$RUNNER_TEMP/straja-test.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/straja-test.keychain-db"
          security default-keychain -d user -s "$RUNNER_TEMP/straja-test.keychain-db"
          security set-keychain-settings -lut 7200 "$RUNNER_TEMP/straja-test.keychain-db"
          security unlock-keychain -p fixture "$RUNNER_TEMP/straja-test.keychain-db"
      - name: Build native application
        id: native_build
        run: cargo build --locked --release --bins
      - uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/debug
          key: native-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
      - name: Ubuntu isolated tests
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c 'printf fixture | gnome-keyring-daemon --unlock --components=secrets; cargo test --locked --lib --bin StrajaBackupSQL --test core --test mail --test backup_pipeline'
      - name: macOS isolated tests
        if: runner.os == 'macOS'
        run: python3 scripts/native_mac_tests.py
      - uses: actions/cache/save@v4
        if: always() && steps.native_build.outcome == 'success'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/debug
          key: native-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}-tested
      - name: Bundle clients, verify relocation and package
        run: python3 scripts/package_native.py --sources
      - name: Ubuntu desktop smoke test (empty disposable profile)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1440x960x24' python3 scripts/native_gui_smoke.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: StrajaBackupSQL-${{ matrix.platform }}-diagnostics
          path: |
            dist/native/*.log
            dist/native/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: StrajaBackupSQL-${{ matrix.platform }}
          path: dist/native/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: StrajaBackupSQL-${{ matrix.platform }}-sources
          path: dist/native-sources/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
