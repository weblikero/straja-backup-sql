name: Native Ubuntu and macOS kits
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'Cargo.*', 'build.rs', 'scripts/package_native.py', '.github/workflows/native-kits.yml', 'locales/**']
permissions:
  contents: read
concurrency:
  group: native-kits-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Ubuntu build dependencies (runner only)
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libdbus-1-dev libmariadb3 libpq5 libssl3t64 libedit2 libaio1t64 liblz4-1 libzstd1 libpcre2-8-0 libtinfo6 libreadline8t64 libncurses6 libxml2 libkrb5-3 libfido2-1 libevent-core-2.1-7t64 patchelf gnome-keyring dbus-x11
      - name: macOS client kegs (runner only, no services started)
        if: runner.os == 'macOS'
        run: |
          brew install mysql-client@8.4 mariadb@11.4 libpq
          security create-keychain -p fixture "$RUNNER_TEMP/straja-test.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/straja-test.keychain-db"
          security unlock-keychain -p fixture "$RUNNER_TEMP/straja-test.keychain-db"
      - name: Build native application
        run: cargo build --locked --release --bins
      - name: Ubuntu isolated tests
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c 'printf fixture | gnome-keyring-daemon --unlock --components=secrets; cargo test --locked --lib --bin StrajaBackupSQL --test core --test mail'
      - name: macOS isolated tests
        if: runner.os == 'macOS'
        run: cargo test --locked --lib --bin StrajaBackupSQL --test core --test mail
      - name: Bundle clients, verify relocation and package
        run: python3 scripts/package_native.py --sources
      - uses: actions/upload-artifact@v4
        with:
          name: StrajaBackupSQL-${{ matrix.platform }}
          path: dist/native/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: StrajaBackupSQL-${{ matrix.platform }}-sources
          path: dist/native-sources/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
